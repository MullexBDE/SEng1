name: 'GitHub CI MVNW'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:

    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    name: on ${{ matrix.platform }} with JDK 25

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true
          cache: 'maven'
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      - name: Build with Maven
        run: ./mvnw -V --color always -ntp
      - name: Archive generated documents
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: generated-docs
          path: |
            target/generated-docs/*.pdf
            target/generated-docs/*.html
