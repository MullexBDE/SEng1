name: Publish Pages

on:
  push:
    branches:
      - 'abgabe-*'
      - 'Abgabe-*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Pages

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.16

      - name: Set up Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Build with Maven
        run: >-
          mvn --batch-mode --color always --errors --fail-at-end
          --show-version -ntp
          -Duser.timezone=Europe/Berlin verify

      - name: Prepare Pages content
        run: |
          mkdir public
          echo 'seng1.melvinlux.de' > public/CNAME
          cp -v target/generated-docs/html/spezifikation.html public/index.html
          cp -v target/generated-docs/html/*.html public/
          cp -rv target/generated-docs/html/examples public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
